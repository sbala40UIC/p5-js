<!DOCTYPE html>
<html lang="en-US">

  <head>
  
    <title>Untitled</title>
    
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>


  </head>
  
  <body>
  
    <script>
    
      let circleX = 100;
      let circleY = 500;
      let circleSize = 50;
      
      function setup () {
        createCanvas(800, 600);
        background("#F2B1B7");
        //colorMode(HSL, 100, 75, 60);
        let from = color(218, 165, 32);
        let to = color(72, 61, 139)
        let interA = lerpColor(from, to, 0.33);
        let interB = lerpColor(from, to, 0.66);
        let interC = lerpColor(from, to, 0.5);
        fill(interC);
        ellipse(circleX, circleY, circleSize);
      }
      
      function draw () {
        
        let str = "lol";
        
        circle(200, 200, 50)
        
        strokeWeight(2);
        stroke('yellow');
        line(340, 340, 600, 400);
        fill(50, 30, 25, 80);
        stroke('blue');
        
        beginShape(TRIANGLE_FAN);
        vertex(50, 50);
        vertex(240, 300);
        vertex(625, 754);
        vertex(60, 205);
        endShape(CLOSE);
        
        fill("#155C21")
        rect(340, 400, 50, 75);
        fill(60, 239, 212);
        
        triangle(230, 360, 330, 300, 435, 365);
        fill(306, 77, 57);
        arc(600, 50, 100, 100, radians(90), radians(360));
        
        textSize(45);
        fill('white');
        stroke(122, 32, 91)
        strokeWeight(5);
        text(str, 600, 500)
      }



    </script>
    
  </body>

</html>
